<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Home Hub</title>
  <meta name="description" content="Household budget, calendar and lists — synced across devices.">
  <meta name="theme-color" content="#4f7396">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    /* Apply saved appearance before first paint so there is no flash of the wrong colors. */
    (function () {
      try {
        var g = function (k, d) { var v = localStorage.getItem('homehub:pref:' + k); return v === null ? d : v; };
        var h = document.documentElement, m = g('mode', 'auto');
        var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        h.dataset.palette = g('palette', 'wedding');
        h.dataset.mode = dark ? 'dark' : 'light';
        h.dataset.contrast = g('contrast', '0') === '1' ? 'high' : 'normal';
        h.style.setProperty('--fs-scale', g('textSize', '1'));
        h.classList.toggle('hide-amounts', g('hideAmounts', '0') === '1');
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Home Hub</h1>
        <div class="top-actions">
          <button class="eye-btn" id="privacy-btn" type="button" aria-pressed="false" title="Hide amounts">👁</button>
          <button class="sync-pill" id="sync-pill" type="button" title="Sync status"></button>
        </div>
      </header>
      <div id="demo-banner" class="demo-banner" hidden></div>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" class="modal"></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
