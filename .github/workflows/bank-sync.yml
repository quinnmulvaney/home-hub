name: Bank sync

on:
  schedule:
    - cron: "23 11,19,3 * * *"   # ~7am, 3pm, 11pm Eastern. SimpleFIN refreshes from the bank about once a day.
  workflow_dispatch:
    inputs:
      mode:
        description: "sync = pull from bank; audit = read-only data check; inspect = list which fields the bank feed has (names only)"
        type: choice
        options: [sync, audit, inspect]
        default: sync
      lookback_days:
        description: "Days of history to request"
        default: "30"
      dry_run:
        description: "Compute only, write nothing"
        type: boolean
        default: false

# Nothing here can change the repository. (The keep-alive job below is the only one that can, and it holds no secrets.)
permissions:
  contents: read

concurrency: bank-sync

# SECURITY NOTES
# - This repo is public, and so are its workflow logs. Everything sensitive lives in encrypted secrets, which GitHub masks
#   in logs. Never pass sensitive values through `vars.*` (repository variables are NOT masked).
# - The scripts print counts only, never amounts, merchants, names or ids.
# - Actions are pinned to full commit SHAs and the Python dependency to an exact version (supply-chain hygiene).

jobs:
  sync:
    if: github.repository == 'quinnmulvaney/home-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"

      - run: pip install --quiet firebase-admin==7.7.0

      - name: Audit data (read-only)
        if: inputs.mode == 'audit'
        run: python sync/audit.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOUSEHOLD_ID: ${{ secrets.HOUSEHOLD_ID }}
          AUDIT_EXPECTED: ${{ secrets.AUDIT_EXPECTED }}

      - name: Inspect bank feed fields (names only)
        if: inputs.mode == 'inspect'
        run: python sync/inspect_fields.py
        env:
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}

      - name: Sync transactions
        if: inputs.mode != 'audit' && inputs.mode != 'inspect'
        run: python sync/bank_sync.py
        env:
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOUSEHOLD_ID: ${{ secrets.HOUSEHOLD_ID }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '30' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

  # GitHub pauses scheduled workflows in repos with no activity for 60 days. This job makes an empty commit when needed.
  # It has write access but no secrets and runs no third-party packages.
  keepalive:
    if: github.repository == 'quinnmulvaney/home-hub' && github.event_name == 'schedule'
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - name: Keep schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep bank sync schedule active"
            git push
          fi
