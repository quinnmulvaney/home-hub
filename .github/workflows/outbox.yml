name: Push delivery

# Runs every few minutes. Sends queued push notifications (like "Sam gave you a task") and each person's morning
# summary. A normal run reads almost nothing, so it stays well inside the free limits.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute only, send nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: outbox
  cancel-in-progress: false

# The repo (and these logs) are public. Everything sensitive is an encrypted secret; the script logs counts only.
jobs:
  deliver:
    if: github.repository == 'quinnmulvaney/home-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - run: pip install --quiet -r sync/requirements.txt

      - name: Deliver pushes and morning summaries
        run: python sync/outbox.py
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          HOUSEHOLD_ID: ${{ secrets.HOUSEHOLD_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
